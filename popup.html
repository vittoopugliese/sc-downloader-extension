<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html {
            margin: 0;
            padding: 0;
            background: #000000;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 426px;
            min-height: 200px;
            color: white;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        body.selection-mode {
            min-height: 520px;
            max-height: 520px;
        }

        body.selection-mode .container {
            min-height: 520px;
        }

        body.selection-mode #waveformCanvas {
            display: none !important;
        }

        body.selection-mode .track-details > h2,
        body.selection-mode #artistUrl,
        body.selection-mode #duration,
        body.selection-mode #metaSep,
        body.selection-mode #downloadLimit {
            display: none !important;
        }

        body.selection-mode .track-details {
            gap: 0;
        }

        *::selection {
            background-color: #ffffffbb;
            color: rgb(31, 31, 31);
        }

        .is-hidden {
            display: none !important;
        }

        .container {
            background: rgba(0, 0, 0, 0.54);
            min-height: 200px;
            height: 100%;
            padding: 12px;
            padding-top: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .track-info { text-align: center; }

        .track-details {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 4px;
        }

        #artwork {
            position: fixed;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background-size: cover;
            background-position: center;
            filter: brightness(0.754) blur(5px);
            z-index: -1;
        }

        #loadingOverlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #000000;
        }

        #loadingOverlay.is-hidden {
            display: none;
        }

        .spinner-ring {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-ring::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: #ff5500;
            animation: spin 0.9s linear infinite;
        }

        .spinner-logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loadingText {
            margin: 0;
            font-size: 14px;
            color: #cccccc;
            text-align: center;
            max-width: 280px;
        }

        #retryBtn {
            display: none;
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            background: #ff5500;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 200ms, transform 200ms;
        }

        #retryBtn:hover {
            background: #ff7733;
            transform: scale(1.04);
        }

        #retryBtn.is-visible {
            display: inline-block;
        }

        #errorOverlay {
            position: absolute;
            inset: 0;
            z-index: 9;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            background: radial-gradient(circle at 50% 35%, #242424 0%, #000000 70%);
        }

        #errorOverlay.is-visible {
            display: flex;
        }

        .error-logo {
            width: 54px;
            height: 54px;
            border-radius: 20%;
            opacity: 0.92;
            animation: floaty 3s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        #errorTitle {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
        }

        #errorMessage {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: #b8b8b8;
        }

        #errorHint {
            margin: 0;
            font-size: 12px;
            color: #ff7733;
            max-width: 300px;
        }

        #title {
            margin: 0;
            line-height: 30px;
            font-size: 24px;
        }

        #artistArtwork{ border-radius: 50%; }

        #artistUrl {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            gap: 10px;
            padding: 12px 0px;
        }

        #artist {
            margin: 0;
            font-size: 16px;
            color: #cccccc;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }

        .download-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
            width: 100%;
        }

        #downloadBtn {
            width: 37px;
            height: 37px;
            padding: 0;
            background-color: #ffffffc7;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 254ms, transform 254ms;
        }

        #downloadBtn:hover {
            background-color: #ffffff;
            transform: scale(1.054);
        }

        #downloadBtn.is-disabled {
            cursor: default;
            pointer-events: none;
        }

        #downloadBtn.is-hidden {
            display: none;
        }

        .dl-icon {
            width: 26px;
            height: 26px;
            display: block;
        }

        .dl-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid rgba(0, 0, 0, 0.15);
            border-top-color: #ff5500;
            animation: spin 0.8s linear infinite;
        }

        #downloadBtn.is-loading .dl-icon {
            display: none;
        }

        #downloadBtn.is-loading .dl-spinner {
            display: block;
        }

        .track-meta {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            color: #c4c4c4;
            font-size: 14px;
        }

        .meta-sep {
            color: #7e7e7e;
            font-size: 20px;
        }

        #downloadLimit {
            margin: 0;
            padding: 4px 10px;
            min-width: 0;
            max-width: 62px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);
            color: #e8e8e8;
            font-size: 13px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            outline: none;
            transition: background-color 200ms, border-color 200ms;
        }

        #downloadLimit:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.28);
        }

        #downloadLimit:focus {
            border-color: rgba(255, 85, 0, 0.65);
        }

        #downloadLimit.is-hidden {
            display: none;
        }

        #downloadLimit option,
        #downloadFormat option {
            background: #1a1a1a;
            color: #ffffff;
        }

        #downloadFormat {
            margin: 0;
            padding: 4px 10px;
            min-width: 0;
            max-width: 150px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);
            color: #e8e8e8;
            font-size: 13px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            outline: none;
            transition: background-color 200ms, border-color 200ms;
        }

        #downloadFormat:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.28);
        }

        #downloadFormat:focus {
            border-color: rgba(255, 85, 0, 0.65);
        }

        #downloadFormat.is-hidden {
            display: none;
        }

        #chooseDownloadFolder {
            margin: 0;
            padding: 4px 10px;
            max-width: 112px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.12);
            color: #e8e8e8;
            font: 13px Arial, sans-serif;
            cursor: pointer;
            outline: none;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: background-color 200ms, border-color 200ms;
        }

        #chooseDownloadFolder:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.28);
        }

        #chooseDownloadFolder:focus {
            border-color: rgba(255, 85, 0, 0.65);
        }

        #chooseDownloadFolder:disabled {
            cursor: default;
            opacity: 0.55;
        }

        #downloadStatus {
            margin: 0;
            min-height: 16px;
            font-size: 13px;
            color: #c4c4c4;
            text-align: center;
            max-width: 380px;
            line-height: 1.4;
        }

        #jobControls {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        #jobControls.is-visible {
            display: flex;
        }

        .job-btn {
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: #f0f0f0;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 200ms, border-color 200ms;
        }

        .job-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.32);
        }

        .job-btn.is-primary {
            background: #ff5500;
            border-color: #ff5500;
            color: #ffffff;
        }

        .job-btn.is-primary:hover {
            background: #ff7733;
            border-color: #ff7733;
        }

        .job-btn.is-danger {
            border-color: rgba(255, 85, 0, 0.55);
            color: #ffb899;
        }

        #jobHint {
            margin: 0;
            font-size: 11px;
            color: #9a9a9a;
            text-align: center;
            max-width: 360px;
        }

        #failedSummary {
            display: none;
            margin: 0;
            font-size: 11px;
            color: #ffb899;
            text-align: center;
            max-width: 360px;
            line-height: 1.35;
        }

        #failedSummary.is-visible {
            display: block;
        }

        #waveformCanvas {
            background: transparent;
            width: 100%;
            height: 80px;
            display: block;
        }

        #selectionPanel {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            gap: 8px;
        }

        #selectionPanel.is-visible {
            display: flex;
        }

        .selection-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .selection-header-btn {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        .selection-header-btn:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        #selectionCount {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #ddd;
        }

        #selectionViewport {
            height: 320px;
            overflow-y: auto;
            overflow-x: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.35);
        }

        #selectionSpacer {
            position: relative;
            width: 100%;
        }

        #selectionRows {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }

        .selection-row {
            position: absolute;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
            box-sizing: border-box;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .selection-row:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .selection-row input[type="checkbox"] {
            flex-shrink: 0;
            accent-color: #ff5500;
            cursor: pointer;
        }

        .selection-index {
            flex-shrink: 0;
            width: 36px;
            font-size: 11px;
            color: #aaa;
            font-variant-numeric: tabular-nums;
        }

        .selection-title {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            color: #f2f2f2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .selection-duration {
            flex-shrink: 0;
            font-size: 11px;
            color: #aaa;
            font-variant-numeric: tabular-nums;
        }

        a:link { text-decoration: none; }
        a:visited { text-decoration: none; }
        a:hover { text-decoration: none; }
        a:active { text-decoration: none; }
    </style>
</head>

<body>
    <div id="loadingOverlay">
        <div class="spinner-ring">
            <img src="./assets/icon128.png" class="spinner-logo" alt="Loading" draggable="false">
        </div>
        <p id="loadingText">Loading track...</p>
        <button id="retryBtn" type="button">Retry</button>
    </div>

    <div id="errorOverlay">
        <img src="./assets/icon128.png" class="error-logo" alt="SoundCloud Downloader" draggable="false">
        <h2 id="errorTitle">No track selected</h2>
        <p id="errorMessage">Open a SoundCloud track page to download it.</p>
        <p id="errorHint"></p>
    </div>

    <div id="artwork"></div>
    <div class="container">
        <div class="track-info">
            <div class="track-details">
                <h2 id="title"></h2>
                <a id="artistUrl" target="_blank">
                    <img id="artistArtwork" src="./assets/icon48.png" alt="artist_image" width="30px" height="30px" draggable="false">
                    <h3 id="artist"></h3>
                </a>
                <p class="track-meta">
                    <span id="duration"></span>
                    <span id="metaSep" class="meta-sep">&middot;</span>
                    <span id="streamFormat"></span>
                    <select id="downloadFormat" class="is-hidden" aria-label="Download format">
                        <option value="auto">Auto</option>
                        <option value="original">Original</option>
                        <option value="mp3">MP3</option>
                        <option value="m4a">M4A</option>
                        <option value="opus">Opus</option>
                    </select>
                    <select id="downloadLimit" class="is-hidden" aria-label="Download amount">
                        <option value="50">50</option>
                    </select>
                    <button id="chooseDownloadFolder" type="button" class="is-hidden" aria-label="Choose download folder" title="Choose download folder">Folder</button>
                </p>
            </div>
        </div>

        <canvas id="waveformCanvas" width="380" height="80" style="display: none;"></canvas>

        <div id="selectionPanel" class="is-hidden" aria-label="Track selection">
            <div class="selection-header">
                <button id="selectionBackBtn" type="button" class="selection-header-btn">Back</button>
                <span id="selectionCount">0 selected</span>
                <button id="selectAllBtn" type="button" class="selection-header-btn">All</button>
                <button id="clearAllBtn" type="button" class="selection-header-btn">Clear</button>
            </div>
            <div id="selectionViewport">
                <div id="selectionSpacer">
                    <div id="selectionRows"></div>
                </div>
            </div>
        </div>

        <div class="download-button-container">
            <button id="downloadBtn" type="button" aria-label="Download" class="is-hidden">
                <img class="dl-icon" src="./assets/download.svg" alt="" width="22" height="22" draggable="false">
                <span class="dl-spinner" aria-hidden="true"></span>
            </button>
            <div id="jobControls">
                <button id="pauseJobBtn" type="button" class="job-btn">Pause</button>
                <button id="resumeJobBtn" type="button" class="job-btn is-primary is-hidden">Resume</button>
                <button id="cancelJobBtn" type="button" class="job-btn is-danger">Cancel</button>
            </div>
            <p id="downloadStatus">Ready to download</p>
            <p id="jobHint" class="is-hidden">You can close this popup — the download continues in the background.</p>
            <p id="failedSummary"></p>
        </div>
    </div>
    <script src="./scripts/format-utils.js"></script>
    <script src="./scripts/directory-storage.js"></script>
    <script src="./scripts/stream-selector.js"></script>
    <script src="./scripts/download-track.js"></script>
    <script src="./scripts/download-intent.js"></script>
    <script src="./scripts/popup.js"></script>
</body>

</html>
