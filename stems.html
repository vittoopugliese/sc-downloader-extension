<!doctype html>
<html lang="en">
<head>
  <script src="scripts/icons.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem Extractor · Player Tools</title>
  <link rel="icon" href="assets/icons/player-toolkit.png">
  <link rel="stylesheet" href="assets/stems.css">
  <link rel="stylesheet" href="assets/stem-playlist.css">
  <link rel="stylesheet" href="assets/icon-cursors.css">
  <link rel="stylesheet" href="assets/ui-button.css">
  <link rel="stylesheet" href="assets/ui-knob.css">
  <link rel="stylesheet" href="scripts/vendor/toastify/toastify.css">
  <link rel="stylesheet" href="assets/ui-toast.css">
</head>
<body>
  <main>
    <!-- FL Studio-style header: identity and transport, then hint/status, stem meters and the library. -->
    <header class="workspace-header" aria-labelledby="workspace-title" data-pinned="true">
      <div class="daw-row daw-row-main">
        <div class="workspace-intro">
          <div class="brand"><sc-icon name="toolkit" style="--icon-size:22px" aria-hidden="true"></sc-icon><span>PLAYER TOOLS</span><span class="workspace-edition">MINI DAW</span></div>
          <h2 id="workspace-title"><span>Stem Extractor</span><span class="title-dot" aria-hidden="true">.</span></h2><p data-copy="workspace">Separate. Mix. Make it yours.</p>
        </div>
      <!-- Every header button is the shared ui-btn (scripts/ui-button.mjs, assets/ui-button.css). -->
      <div id="transport" class="transport-bar" role="toolbar" aria-label="Transport"><button id="play" class="ui-btn ui-btn--accent ui-btn--icon" type="button" aria-label="Play" aria-pressed="false" title="Play"><span data-icon="play"></span></button>
      <div class="stem-tempo" role="group" aria-label="Playback speed"><div class="slider-wrap"><div class="limits" aria-hidden="true"><span>0.1x</span><span>3x</span></div><span class="range-label" aria-hidden="true">Tone &amp; Velocity</span><input id="stem-rate" class="slider" type="range" min="0.1" max="3" step="0.0125" value="1" aria-label="Playback speed"></div><label class="keep-tone" title="Keep tone: change playback speed without changing the pitch."><input id="stem-keep-tone" type="checkbox" aria-label="Keep tone"></label><output id="stem-rate-value" for="stem-rate">1.000x</output></div>
      <button id="toggle-game" class="ui-btn ui-btn--accent ui-btn--icon" type="button" aria-expanded="false" aria-controls="game-panel"><span data-icon="game"></span></button></div>
      </div>
      <div class="daw-row daw-row-sub workspace-toolbar">
        <div class="daw-hint">
          <div class="source-mini"><div class="source-cover"><img id="artwork" alt="" referrerpolicy="no-referrer" hidden><span id="artwork-fallback" data-icon="music"></span></div><h1 id="track" class="track"></h1></div>
        </div>
        <div class="stem-preview" aria-hidden="true">
          <div class="preview-track" data-channel="vocals"><span data-icon="vocals"></span><span data-copy="vocals">Vocals</span><span class="preview-wave"></span><span class="preview-number">01</span></div>
          <div class="preview-track" data-channel="drums"><span data-icon="drums"></span><span data-copy="drums">Drums</span><span class="preview-wave"></span><span class="preview-number">02</span></div>
          <div class="preview-track" data-channel="bass"><span data-icon="bass"></span><span data-copy="bass">Bass</span><span class="preview-wave"></span><span class="preview-number">03</span></div>
          <div class="preview-track" data-channel="other"><span data-icon="other"></span><span data-copy="other">Other</span><span class="preview-wave"></span><span class="preview-number">04</span></div>
        </div>
        <div class="header-library">
          <div class="preset-toolbar"><select id="stem-presets" disabled></select><button id="save-locally" class="ui-btn ui-btn--neutral ui-btn--icon" type="button" aria-pressed="false" disabled><span data-icon="save"></span></button><button id="preset-folder" class="ui-btn ui-btn--neutral ui-btn--icon" type="button" disabled><sc-icon name="folder" class="ui-btn-icon" aria-hidden="true"></sc-icon></button><button id="preset-reset" class="ui-btn ui-btn--neutral ui-btn--icon" type="button" hidden><sc-icon name="close" class="ui-btn-icon" aria-hidden="true"></sc-icon></button><button id="import-audio" class="ui-btn ui-btn--accent ui-btn--text" type="button" disabled><span data-icon="upload"></span><span id="import-audio-label" class="ui-btn-label">Load</span></button></div>
          <button id="preset-reconnect" type="button" hidden></button>
        </div>
        <button id="header-pin" class="header-pin ui-btn ui-btn--ghost ui-btn--icon" type="button" aria-pressed="true"><span data-icon="pin"></span></button>
        <input id="audio-file" type="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg,.aac,.aif,.aiff" hidden>
      </div>
      <progress id="progress" max="1" value="0" hidden></progress>
    </header>
    <div class="studio-card"><section class="prepare" aria-label="Separation" data-copy-aria-label="separationLabel">
      <div id="game-panel" hidden></div>
    </section>
    <section id="audition" hidden aria-label="Listen and compare" data-copy-aria-label="listenCompareLabel">
      <div id="original-waveform"></div>
    </section>
    <section id="playlist" aria-label="Playlist"></section>
    <section id="mixer" aria-label="Plugins">
      <div id="mix-tools"></div>
    </section>
    </div>
  </main>
  <dialog id="save-dialog" aria-labelledby="save-title" aria-describedby="save-description"><h3 id="save-title"></h3><p id="save-description"></p><label id="save-name-label" for="save-name"></label><input id="save-name" maxlength="160"><p id="save-destination" class="muted"></p><div class="dialog-actions"><button id="save-cancel" type="button" autofocus></button><button id="save-confirm" class="primary" type="button"></button></div></dialog>
  <dialog id="import-dialog" aria-labelledby="import-title"><form id="import-form"><h3 id="import-title"></h3><p id="import-file-info" class="muted"></p><label id="import-name-label" for="import-name"></label><input id="import-name" maxlength="160" required><div class="import-range"><label><span id="import-start-label"></span><input id="import-start" type="number" min="0" step="any" required></label><label><span id="import-end-label"></span><input id="import-end" type="number" min="0" step="any" required></label></div><p id="import-range-hint" class="muted"></p><p id="import-error" role="alert"></p><div class="dialog-actions"><button id="import-cancel" type="button"></button><button id="import-confirm" type="submit" class="primary"></button></div></form></dialog>
  <script src="scripts/player-tools-i18n.js"></script>
  <script src="scripts/looper-core.js"></script>
  <script src="scripts/sampler-core.js"></script>
  <script src="scripts/spectral-waveform.js"></script>
  <script src="scripts/parametric-eq.js"></script>
  <script src="scripts/audio-effects-core.js"></script>
  <script src="scripts/player-tools-collapsible.js"></script>
  <script src="scripts/parametric-eq-ui.js"></script>
  <script src="scripts/record-core.js"></script>
  <script src="scripts/record-ui.js"></script>
  <script type="module" src="scripts/stems-page.mjs"></script>
</body>
</html>
