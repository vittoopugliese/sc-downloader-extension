<!doctype html>
<html lang="en">
<head>
  <script src="scripts/fast-tooltips.js"></script>
  <script src="scripts/icons.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stem Extractor · Player Tools</title>
  <link rel="icon" href="assets/icons/player-toolkit.png">
  <link rel="stylesheet" href="assets/stems.css">
  <link rel="stylesheet" href="assets/stem-playlist.css">
  <link rel="stylesheet" href="assets/stem-automation.css">
  <link rel="stylesheet" href="assets/icon-cursors.css">
  <link rel="stylesheet" href="assets/ui-button.css">
  <link rel="stylesheet" href="assets/ui-knob.css">
  <link rel="stylesheet" href="assets/ui-drag-number.css">
  <link rel="stylesheet" href="scripts/vendor/toastify/toastify.css">
  <link rel="stylesheet" href="assets/ui-toast.css">
</head>
<body>
  <main>
    <!-- Shared header: one two-row deck (project, transport, speed, output spectrum and the tool
         windows); playlist controls mount as its last row. Layout in assets/stems.css. -->
    <header class="workspace-header" aria-label="Seib" data-pinned="true">
      <div class="daw-deck">
        <div class="daw-start">
          <div class="brand"><img src="assets/icons/player-toolkit.png" width="22" height="22" alt="" draggable="false"><span>Seib</span></div>
          <div class="source-mini"><div class="source-cover"><img id="artwork" alt="" referrerpolicy="no-referrer" hidden><span id="artwork-fallback" data-icon="music"></span></div></div>
          <div id="track" class="header-library">
            <div class="preset-toolbar"><select id="stem-presets" disabled></select><button id="save-project" class="ui-btn ui-btn--neutral ui-btn--icon" type="button" aria-keyshortcuts="Control+S" disabled><span data-icon="save"></span></button><button id="preset-folder" class="ui-btn ui-btn--neutral ui-btn--icon" type="button" disabled><sc-icon name="folder" class="ui-btn-icon" aria-hidden="true"></sc-icon></button><button id="preset-reset" class="ui-btn ui-btn--neutral ui-btn--icon" type="button" hidden><sc-icon name="close" class="ui-btn-icon" aria-hidden="true"></sc-icon></button><button id="import-audio" class="ui-btn ui-btn--accent ui-btn--icon" type="button" disabled><span data-icon="upload"></span></button></div>
            <button id="preset-reconnect" type="button" hidden></button>
          </div>
        </div>
        <!-- Every header button is the shared ui-btn (scripts/ui-button.mjs, assets/ui-button.css). -->
        <div id="transport" class="transport-bar" role="toolbar" aria-label="Transport"><button id="play" class="ui-btn ui-btn--accent ui-btn--icon" type="button" aria-label="Play" aria-pressed="false" data-scdl-tooltip="Play"><span data-icon="play"></span></button>
        <div class="stem-tempo" role="group" aria-label="Playback speed"><div class="slider-wrap"><div class="limits" aria-hidden="true"><span>0.1x</span><span>3x</span></div><span class="range-label" aria-hidden="true">Tone &amp; Velocity</span><input id="stem-rate" class="slider" type="range" min="0.1" max="3" step="0.0125" value="1" aria-label="Playback speed"></div><label class="keep-tone" data-scdl-tooltip="Keep tone: change playback speed without changing the pitch."><input id="stem-keep-tone" type="checkbox" aria-label="Keep tone"></label><output id="stem-rate-value" for="stem-rate">1.000x</output></div>
        <button id="header-pin" class="header-pin ui-btn ui-btn--ghost ui-btn--icon" type="button" aria-pressed="true"><span data-icon="pin"></span></button>
        <button id="toggle-game" class="ui-btn ui-btn--accent ui-btn--icon" type="button" aria-expanded="false" aria-controls="game-panel"><span data-icon="game"></span></button></div>
        <div class="output-monitor-slot">
          <div id="output-monitor" class="output-monitor" role="img">
            <canvas class="output-monitor-canvas" aria-hidden="true"></canvas>
          </div>
        </div>
        <input id="audio-file" type="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg,.aac,.aif,.aiff" hidden>
      </div>
    </header>
    <section class="prepare" aria-label="Separation" data-copy-aria-label="separationLabel">
      <div id="game-panel" hidden></div>
    </section>
    <section id="audition" hidden aria-label="Listen and compare" data-copy-aria-label="listenCompareLabel">
      <div id="original-waveform"></div>
    </section>
    <section id="playlist" aria-label="Playlist"></section>
    <section id="mixer" aria-label="Plugins">
      <div id="mix-tools"></div>
    </section>
  </main>
  <dialog id="import-dialog" aria-labelledby="import-title"><form id="import-form"><h3 id="import-title"></h3><p id="import-file-info" class="muted"></p><label id="import-name-label" for="import-name"></label><input id="import-name" maxlength="160" required><div class="import-range"><label><span id="import-start-label"></span><input id="import-start" type="number" min="0" step="any" required></label><label><span id="import-end-label"></span><input id="import-end" type="number" min="0" step="any" required></label></div><p id="import-range-hint" class="muted"></p><p id="import-error" role="alert"></p><div class="dialog-actions"><button id="import-cancel" type="button"></button><button id="import-confirm" type="submit" class="primary"></button></div></form></dialog>
  <script src="scripts/player-tools-i18n.js"></script>
  <script src="scripts/looper-core.js"></script>
  <script src="scripts/sampler-core.js"></script>
  <script src="scripts/spectral-waveform.js"></script>
  <script src="scripts/parametric-eq.js"></script>
  <script src="scripts/audio-effects-core.js"></script>
  <script src="scripts/player-tools-collapsible.js"></script>
  <script src="scripts/parametric-eq-ui.js"></script>
  <script src="scripts/record-core.js"></script>
  <script src="scripts/record-ui.js"></script>
  <script type="module" src="scripts/stems-page.mjs"></script>
</body>
</html>
